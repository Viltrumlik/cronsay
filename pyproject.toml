[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cronsay"
version = "0.1.0"
description = "Say what a cron expression actually means, and when it next fires."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alisher Muhammadaliyev", email = "viltrumlik@gmail.com" }]
keywords = ["cron", "crontab", "schedule", "cli", "explain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Viltrumlik/cronsay"
Issues = "https://github.com/Viltrumlik/cronsay/issues"

[project.scripts]
cronsay = "cronsay:main"

[tool.setuptools]
py-modules = ["cronsay"]
